
[IWADSearch.Directories]
Path=.
Path=$DOOMWADDIR
Path=~/.config/zandronum/
Path=/usr/local/share/
Path=/app/share/games/doom/
Path=$XDG_DATA_HOME/doomseeker/

[FileSearch.Directories]
Path=~/.config/zandronum/
Path=/usr/local/share/
Path=$DOOMWADDIR
Path=/app/share/games/qcde/
Path=/app/share/games/qcde/wads/
Path=$XDG_DATA_HOME/doomseeker/

[GlobalSettings]
movesway=0.5
gl_true_fov=true
gl_texture_filter=1
gl_texture_filter_anisotropic=16
gl_dynlight_shader=true
fluid_patchset=/app/share/sounds/sf2/gm.sf2
snd_mididevice=-5
snd_output=SDL

[Doom.ConsoleVariables]
menu_screenratios=-1
menu_skirmishtimelimit=10
menu_skirmishfraglimit=30
menu_skirmishpointlimit=3
menu_skirmishduellimit=1
menu_skirmishwinlimit=3
menu_skirmishwavelimit=8
menu_skirmishbotskill=2
menu_skirmishskill=2
menu_skirmishmodifier=0
menu_skirmishgamemode=3
menu_skirmishlevel=42
menu_botspawn3=180
menu_botspawn2=179
menu_botspawn1=178
menu_botspawn0=177
con_scaletext=true
con_scaletext_usescreenratio=true
con_virtualheight=360
con_virtualwidth=640
gl_lightmode=0
gl_precache=true
displaynametags=0
crosshair=8
cl_announcer=1
cl_enemycolor=FF 00 00
cl_allycolor=00 00 FF
screenblocks=10

[Doom.LocalServerInfo.Mod]
sv_minPlayers=0
sv_showItemTimers=true

[Doom.NetServerInfo.Mod]
sv_minPlayers=0
sv_showItemTimers=true

[Doom.QCDE.Bindings]
